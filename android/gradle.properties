org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Désactiver complètement le NDK pour éviter les erreurs
android.buildFeatures.ndk=false
android.externalNativeBuild.cmake.path=
android.externalNativeBuild.ndkBuild.path=
android.ndkVersion=
android.sdk.ndkVersion=
android.ndk.dir=
android.sdk.ndk.dir=

# System properties pour désactiver le NDK
systemProp.android.ndk.dir=
systemProp.android.sdk.ndk.dir=
systemProp.android.ndkVersion=

# Désactiver complètement les builds natifs
android.externalNativeBuild=false
android.buildFeatures.externalNativeBuild=false
android.buildFeatures.nativeBuild=false